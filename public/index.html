<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1 id="settings-heading">Settings</h1>
        <p>Update your profile and preferences.</p>
      </header>

      <form id="settings-form" novalidate aria-labelledby="settings-heading">
        <section class="form-section" aria-labelledby="profile-heading">
          <h2 id="profile-heading">Profile</h2>

          <div class="field">
            <label for="displayName">Display name</label>
            <input
              id="displayName"
              name="displayName"
              type="text"
              autocomplete="name"
              required
              aria-required="true"
              aria-describedby="displayName-error"
            />
            <p
              id="displayName-error"
              class="error"
              data-error="displayName"
              role="alert"
              hidden
            ></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="email-error"
            />
            <p
              id="email-error"
              class="error"
              data-error="email"
              role="alert"
              hidden
            ></p>
          </div>

          <div class="field">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              aria-required="true"
              aria-describedby="username-hint username-error"
            />
            <p id="username-hint" class="hint">
              Letters, numbers, and underscores only.
            </p>
            <p
              id="username-error"
              class="error"
              data-error="username"
              role="alert"
              hidden
            ></p>
          </div>

          <div class="field">
            <label for="bio">Bio <span class="optional">(optional)</span></label>
            <textarea
              id="bio"
              name="bio"
              rows="4"
              maxlength="500"
              placeholder="Tell us a little about yourself"
              aria-describedby="bio-hint bio-error"
            ></textarea>
            <p id="bio-hint" class="hint">
              <span id="bio-count">0</span> / 500 characters
            </p>
            <p
              id="bio-error"
              class="error"
              data-error="bio"
              role="alert"
              hidden
            ></p>
          </div>
        </section>

        <section class="form-section" aria-labelledby="preferences-heading">
          <h2 id="preferences-heading">Preferences</h2>

          <div class="field">
            <label for="theme">Theme</label>
            <select
              id="theme"
              name="theme"
              required
              aria-required="true"
              aria-describedby="theme-error"
            >
              <option value="">Select a theme</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="system">System</option>
            </select>
            <p
              id="theme-error"
              class="error"
              data-error="theme"
              role="alert"
              hidden
            ></p>
          </div>

          <div class="field">
            <label for="language">Language</label>
            <select
              id="language"
              name="language"
              required
              aria-required="true"
              aria-describedby="language-error"
            >
              <option value="">Select a language</option>
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
            </select>
            <p
              id="language-error"
              class="error"
              data-error="language"
              role="alert"
              hidden
            ></p>
          </div>
        </section>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
        </div>

        <p
          id="form-status"
          class="form-status"
          role="status"
          aria-live="polite"
          hidden
        ></p>
      </form>
    </main>

    <script src="/js/validation/settingsValidation.js"></script>
    <script src="/js/settingsForm.js"></script>
  </body>
</html>
