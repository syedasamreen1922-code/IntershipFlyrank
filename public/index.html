<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <h1>Settings</h1>
        <p>Update your profile and preferences.</p>
      </header>

      <form id="settings-form" novalidate>
        <section class="form-section">
          <h2>Profile</h2>

          <div class="field">
            <label for="displayName">Display name</label>
            <input
              id="displayName"
              name="displayName"
              type="text"
              autocomplete="name"
              required
              minlength="2"
              maxlength="50"
            />
            <p class="error" data-error="displayName" hidden></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
            <p class="error" data-error="email" hidden></p>
          </div>

          <div class="field">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              minlength="3"
              maxlength="20"
              pattern="[a-zA-Z0-9_]+"
            />
            <p class="hint">Letters, numbers, and underscores only.</p>
            <p class="error" data-error="username" hidden></p>
          </div>

          <div class="field">
            <label for="bio">Bio <span class="optional">(optional)</span></label>
            <textarea
              id="bio"
              name="bio"
              rows="4"
              maxlength="500"
              placeholder="Tell us a little about yourself"
            ></textarea>
            <p class="hint"><span id="bio-count">0</span> / 500</p>
            <p class="error" data-error="bio" hidden></p>
          </div>
        </section>

        <section class="form-section">
          <h2>Preferences</h2>

          <div class="field field--checkbox">
            <label class="checkbox-label">
              <input id="notifications" name="notifications" type="checkbox" />
              <span>Email notifications</span>
            </label>
            <p class="error" data-error="notifications" hidden></p>
          </div>

          <div class="field">
            <label for="theme">Theme</label>
            <select id="theme" name="theme" required>
              <option value="">Select a theme</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="system">System</option>
            </select>
            <p class="error" data-error="theme" hidden></p>
          </div>

          <div class="field">
            <label for="language">Language</label>
            <select id="language" name="language" required>
              <option value="">Select a language</option>
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
            </select>
            <p class="error" data-error="language" hidden></p>
          </div>
        </section>

        <div class="form-actions">
          <button type="button" id="reset-btn" class="btn btn-secondary">
            Reset
          </button>
          <button type="submit" class="btn btn-primary">Save settings</button>
        </div>

        <p id="form-status" class="form-status" role="status" hidden></p>
      </form>
    </main>

    <script src="/js/settingsForm.js"></script>
  </body>
</html>
